[package]
name = "tunnel-manager"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[features]
test-utils = ["mockall"]

[dependencies]
aws-config = { version= "1.13.0", features = ["behavior-version-latest"] }
aws-sdk-iotsecuretunneling = { version = "1.121.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
freya = "0.5.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
mockall = { version = "0.15", optional = true }

[dev-dependencies]
mockall = "0.15"
aws-smithy-runtime-api = "1.20"

[build-dependencies]
winresource = "0.1"

# https://docs.rs/cargo-packager/latest/cargo_packager/config/struct.Config.html
[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "Gardin Tunnel Manager"
identifier = "uk.co.gardin.tunnel"
version = "0.1.0"
out_dir = "packages"
icons = [
  "assets/icon.png",
  "assets/icon.ico"
]
resources = [
  "assets"
]
external_binaries = [
  "bin/localproxy"
]

[package.metadata.winresource]
ProductName = "Gardin Tunnel Manager"
