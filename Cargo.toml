[package]
name = "tunnel-manager"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[features]
test-utils = ["mockall"]

[dependencies]
aws-config = { version= "1.8.10", features = ["behavior-version-latest"] }
aws-sdk-iotsecuretunneling = "1.90.0"
freya = "0.3.4"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
mockall = { version = "0.13", optional = true }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
aws-smithy-runtime-api = "1.0"
aws-smithy-types = "1.0"

[build-dependencies]
winresource = "0.1"

# https://docs.rs/cargo-packager/latest/cargo_packager/config/struct.Config.html
[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "Gardin Tunnel Manager"
identifier = "uk.co.gardin.tunnel"
version = "0.1.0"
out_dir = "packages"
icons = [
  "icon.png",
  "icon.ico"
]
resources = [
  "assets"
]
external_binaries = [
  "bin/localproxy"
]

[package.metadata.winresource]
ProductName = "Gardin Tunnel Manager"